name: schrodump

services:
  schrodump:
    image: schrodump/schrodump:latest
    restart: unless-stopped
    # Give the server time to abort an in-flight job and remove its scratch (cleartext dump) before
    # SIGKILL. Matches SCHRODUMP_SHUTDOWN_GRACE_MS (8s) with margin.
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    environment:
      DATABASE_URL: postgres://schrodump:${DB_PASSWORD:?defina DB_PASSWORD no .env}@db:5432/schrodump
      SCHRODUMP_KEK: ${SCHRODUMP_KEK:?gere com 'openssl rand -base64 32' e guarde fora deste host}
      SCHRODUMP_URL: ${SCHRODUMP_URL:-http://localhost:8080}
      # Passed through only when actually set. The server validates these as non-empty strings, so
      # handing it an empty value is not "unset" — it is an invalid value, and it refuses to boot.
      # Leave them out of .env entirely to create the first admin through the setup link instead.
      SCHRODUMP_ADMIN_EMAIL:
      SCHRODUMP_ADMIN_PASSWORD:
      DOCKER_HOST: tcp://docker-proxy:2375
      # The SAME absolute path inside this container and on the host, and that is not cosmetic.
      # Executors mount files out of scratch — the decrypted artifact for a restore, the staging
      # directory for a STAGED dump, the --config file mongo needs — and the bind source of those
      # mounts is resolved by the DOCKER DAEMON, on the host, not inside this container. With a
      # named volume mounted at /scratch, the daemon was asked for a host path /scratch that does
      # not exist, and answered "mounts denied: the path is not shared from the host". STREAM
      # backups still worked (stdout, nothing mounted) while verify, restore, STAGED and every
      # mongo job could not run at all — a deployment that takes backups and can never check one.
      SCHRODUMP_SCRATCH_PATH: ${SCRATCH_HOST_PATH:-/var/lib/schrodump/scratch}
      SCHRODUMP_SCRATCH_MAX_BYTES: ${SCRATCH_MAX_BYTES:-107374182400}
      SCHRODUMP_MAX_CONCURRENT_STAGED: ${MAX_STAGED:-2}
      SCHRODUMP_EXECUTOR_NETWORK: ${EXECUTOR_NETWORK:-schrodump_targets}
      # CIDRs of the hops in front of this server. Decides which address the login rate limit
      # counts. Unset behind a proxy puts every client in one shared bucket; see docs/security.md.
      SCHRODUMP_TRUSTED_PROXIES:
      # Documented in docs/install.md and, until now, never passed through: an operator who set
      # either in .env got the server default and no indication the value had been ignored.
      SCHRODUMP_STAGED_THRESHOLD_BYTES:
      SCHRODUMP_NOTIFY_MIN_GAP_MS:
      # Self-backup of Schrodump's own metadata database. Unset -> disabled, and the server logs a
      # warning saying so at boot.
      SCHRODUMP_SELF_BACKUP_DESTINATION_ID:
      SCHRODUMP_SELF_BACKUP_INTERVAL_MS:
      # The self-backup executor joins `internal`, where the metadata database lives — NOT the
      # target network. The metadata database is deliberately unreachable from the network the
      # customer-database executors run on, and this is the one dump that has to cross that line.
      SCHRODUMP_SELF_BACKUP_NETWORK: ${SELF_BACKUP_NETWORK:-schrodump_internal}
    volumes:
      # Bind, not a named volume, and mounted at its own path: see SCHRODUMP_SCRATCH_PATH above.
      - ${SCRATCH_HOST_PATH:-/var/lib/schrodump/scratch}:${SCRATCH_HOST_PATH:-/var/lib/schrodump/scratch}
    ports:
      # Bound to loopback: the server speaks plain HTTP and authenticates with a session cookie, so
      # the only supported way to reach it from a network is through a TLS-terminating reverse
      # proxy. Set PUBLISH_ADDR=0.0.0.0 to override, and read docs/install.md before you do.
      - "${PUBLISH_ADDR:-127.0.0.1}:${PORT:-8080}:8080"
    networks:
      - internal
      - targets

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schrodump
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: schrodump
    volumes:
      # /var/lib/postgresql, not /var/lib/postgresql/data: from 18 the official image stores data
      # in a major-version subdirectory, and a volume mounted at the old path is detected as an
      # orphaned data directory and refuses to start.
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schrodump -d schrodump"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal

  docker-proxy:
    # Pinned: this container is the only thing standing between Schrodump and root on the host.
    # A floating tag on the component that enforces that boundary is the boundary moving on its
    # own. See docs/security.md.
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      INFO: 1
      POST: 1
      # Required, not optional. FULL_RESTORE verify stands up a throwaway database with
      # withEphemeralService and polls its readiness with `docker exec` (packages/runner
      # docker.ts). With EXEC: 0 the proxy answers 403 to POST /exec/<id>/start and GET
      # /exec/<id>/json — verified against tecnativa/docker-socket-proxy:v0.4.2 — so the readiness
      # probe never succeeds and the product's central feature cannot run. CI never caught it
      # because the integration suite talks to the Docker socket directly, not through this proxy.
      #
      # It does not widen anything: CONTAINERS + POST already accepts a container create carrying
      # Binds and Privileged, which is root on the host. See docs/security.md.
      EXEC: 1
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

volumes:
  db:

networks:
  internal:
    internal: true
  targets:
