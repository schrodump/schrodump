# WHY THIS WORKFLOW EXISTS
#
# A backup tool is a high-value supply chain target: it holds credentials for every database its
# operator runs, and it is trusted to reach all of them. A compromised Schrodump image is not one
# compromised service — it is the customer's entire database estate, plus the backups that would
# have been the way back. That asymmetry is why dependency advisories, image contents, published
# secrets and provenance headers are all checked here, on every change, rather than at release
# time when the pressure to ship makes the answer predictable.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories land against code that has not changed, so time alone must trigger this.
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Two steps on purpose. The gate is set at critical so the workflow stays honest — a gate
      # that is permanently red because an upstream framework has not shipped a patch teaches
      # people to ignore it. Everything at high and below is printed in full and is expected to be
      # read, not skipped.
      - name: Report every advisory
        continue-on-error: true
        run: pnpm audit

      # `pnpm audit` exits 1 for two unrelated reasons: a critical advisory exists, or the
      # registry never answered. Conflating them cost three blocked merges in one day — npm's
      # advisory endpoint (POST /-/npm/v1/security/audits/quick) went down three times while the
      # registry root kept answering in 40ms, and each outage surfaced as an opaque exit 1 that
      # reads exactly like a vulnerability.
      #
      # This does NOT fail open. A network failure is retried, because a socket timeout is what
      # retries are for, and if it never resolves the step still fails — with a message saying the
      # check did not RUN, which is a different thing to hand a human than "you have a critical
      # advisory". Failing open here would repeat the defect the DCO job already documents: a
      # check that reported success when it could not do its work.
      #
      # Exercised locally against all four outcomes before landing: clean (0), critical advisory
      # (1, named as such), timeout-then-success (0 after retry), and permanent outage (1, named
      # as an unrun check). If output ever contains both a network error and an advisory, it is
      # classified as a network failure and still ends in a failure — the wrong message, never a
      # wrong verdict.
      - name: Fail on critical advisories
        run: |
          for attempt in 1 2 3; do
            set +e
            out="$(pnpm audit --audit-level critical 2>&1)"
            code=$?
            set -e
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ]; then
              echo "no critical advisories"
              exit 0
            fi
            if printf '%s' "$out" | grep -qE 'ERR_SOCKET_TIMEOUT|ECONNRESET|ENOTFOUND|EAI_AGAIN|ETIMEDOUT|FetchError|socket hang up|ERR_PNPM_REGISTRY'; then
              echo "::warning::the npm advisory service did not answer (attempt ${attempt} of 3)"
              sleep $((attempt * 20))
              continue
            fi
            echo "::error::pnpm audit reported critical advisories"
            exit "$code"
          done
          echo "::error::the npm advisory service could not be reached in three attempts. This is an UNRUN check, not a clean one, and it fails closed on purpose."
          exit 1

  image:
    name: image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: schrodump/schrodump:scan
          cache-from: type=gha

      # Scans what actually ships, not what the manifest claims: the runtime tree is pruned after
      # install, so the lockfile and the image disagree on purpose.
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: schrodump/schrodump:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy (fail on critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: schrodump/schrodump:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    name: committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans history, not just the working tree — a secret removed in a later commit
          # is still published.
          fetch-depth: 0

      # $GITHUB_WORKSPACE rather than the ${{ }} expression: workflow expressions are interpolated
      # into the shell before it runs, so keeping them out of `run:` is the habit that prevents
      # injection the day one of these values stops being trustworthy.
      - name: Gitleaks
        run: |
          # Pre-pull with retries: the implicit pull inside `docker run` has none, so a transient
          # Docker Hub timeout fails the job (exit 125) for a reason unrelated to secrets. A real
          # leak still fails the scan below (exit 1); only the flaky pull is retried.
          for attempt in 1 2 3; do
            docker pull zricethezav/gitleaks:v8.30.1 && break
            echo "gitleaks image pull failed (attempt ${attempt}/3); retrying..." >&2
            sleep "$((attempt * 5))"
          done
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.30.1 detect \
            --source=/repo --redact --verbose --exit-code=1

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The licence is the project's only leverage over how the code is redistributed, and a file
      # without the header is a file whose licence is arguable.
      - name: Every source file carries the SPDX header
        run: |
          missing=0
          for file in $(git ls-files '*.ts' '*.tsx' '*.mjs' '*.js' '*.sh' 'docker/Dockerfile' \
                        'docker/executors/*.Dockerfile' '.github/workflows/*.yml'); do
            # Regenerated by `next build` on every run; Next owns its contents, not us.
            [ "$file" = "apps/web/next-env.d.ts" ] && continue
            if ! head -5 "$file" | grep -q 'SPDX-License-Identifier: AGPL-3.0-or-later'; then
              echo "missing SPDX header: $file"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "all source files carry the header"
