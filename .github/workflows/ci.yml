name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing about the commit that replaced it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    # Only a pull request has a range to check. A push to main has already been through one.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole range between base and head has to be walkable, so no shallow clone.
          fetch-depth: 0

      # CONTRIBUTING.md asks for `git commit -s`; this is what makes that a requirement rather than
      # a request. Deliberately a few lines of shell rather than a third-party action: the check is
      # trivial, and this repository pins the supply chain everywhere else it can.
      #
      # Merge commits are skipped — a contributor does not author their trailer, and requiring one
      # would fail every PR that merged main back in.
      - name: Every commit carries a Signed-off-by
        env:
          # Through env, never interpolated into the script body: a branch or title can carry
          # anything, and `run:` interpolation is how that becomes shell injection.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Explicit, because a `run:` block is `bash -e` without pipefail, and because the first
          # version of this check passed when `git rev-list` FAILED: the loop got an empty list and
          # reported success. A check that green-lights on its own failure is the exact defect this
          # project exists to argue against, so the range is captured into a variable — which `set
          # -e` does abort on — and an empty range is a failure, not a pass.
          set -euo pipefail

          commits="$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")"
          if [ -z "$commits" ]; then
            echo "no non-merge commits between base and head; nothing was certified"
            exit 1
          fi

          missing=0
          for sha in $commits; do
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <[^>]+@[^>]+>'; then
              printf 'missing Signed-off-by: %s %s\n' "$sha" "$(git show -s --format=%s "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Add it with: git rebase --signoff ${BASE_SHA}"
            echo "See CONTRIBUTING.md — the DCO text is at https://developercertificate.org/"
            exit 1
          fi
          echo "every commit is signed off"

  readme-sync:
    name: readme translations in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needs the base branch to diff against.
          fetch-depth: 0

      # README.md is the source of truth; the translations mirror it. This catches the common
      # miss — editing the English README and forgetting the others — by requiring all three to be
      # touched together. It checks that the files changed, NOT that they say the same thing;
      # semantic equivalence is on the author. base_ref is only set on pull requests, so pushes
      # skip. It is put through env rather than interpolated into the shell on purpose.
      - name: English README changes require the translations
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "${BASE_REF:-}" ]; then
            echo "not a pull request; nothing to enforce"
            exit 0
          fi
          git fetch --quiet origin "$BASE_REF"
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          if ! echo "$changed" | grep -qx 'README.md'; then
            echo "README.md unchanged; nothing to enforce"
            exit 0
          fi
          missing=0
          for translation in README.pt-BR.md README.es.md; do
            if ! echo "$changed" | grep -qx "$translation"; then
              echo "README.md changed but $translation did not — update all three in the same PR."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "all READMEs updated together"

  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # Reported, not enforced. A coverage gate on a young codebase buys tests written to move a
      # number rather than to catch a defect; the number is here to be looked at.
      - name: Coverage
        continue-on-error: true
        run: pnpm -r exec vitest run --coverage --coverage.reporter=text-summary

  integration:
    name: integration (real services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # MinIO is started here rather than declared under `services:` because it needs an explicit
      # `server /data` command, and `services:` cannot override an image's command. The tag is
      # pinned for the same reason the executor images are.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio123 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 1 30); do
            nc -z localhost 9000 && break
            sleep 1
          done

      - name: Create the test bucket
        env:
          AWS_ACCESS_KEY_ID: minio
          AWS_SECRET_ACCESS_KEY: minio123
          AWS_DEFAULT_REGION: us-east-1
        run: aws --endpoint-url http://localhost:9000 s3 mb s3://schrodump-test

      # The engine probes and the Docker runner provision their own containers through
      # testcontainers/dockerode, so they need Docker on the runner rather than a declared service.
      #
      # A MongoDB REPLICA SET is now exercised by default: probe.integration.test.ts stands one up
      # with a keyfile and asserts isReplicaSet, which is the single fact the whole oplog chain
      # hangs from (it decides whether buildDump emits --oplog, whether that is recorded on the
      # artifact, and whether a FULL_CLUSTER restore replays it). It was unit-tested only until the
      # test could reach a real one.
      #
      # The engine images are overridable by environment, which is what the edges step below uses.
      # The `age` CLI, for the interop test in apps/server/src/crypto. It asserts that an artifact
      # this server writes opens with the STANDARD binary — the tool an operator actually has on the
      # day the metadata database is gone. Every other crypto test decrypts with the same library
      # that encrypted, which proves self-consistency and nothing about that day. The test skips
      # silently without the binary, so it has to be installed here to be worth having.
      - name: Install the age CLI
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Integration tests
        env:
          SCHRODUMP_TEST_INTEGRATION: "1"
          SCHRODUMP_TEST_S3_ENDPOINT: http://localhost:9000
          SCHRODUMP_TEST_S3_REGION: us-east-1
          SCHRODUMP_TEST_S3_BUCKET: schrodump-test
          SCHRODUMP_TEST_S3_ACCESS_KEY: minio
          SCHRODUMP_TEST_S3_SECRET_KEY: minio123
        run: pnpm test

      # The supported-range edges and MariaDB, in a probe-only pass. Cheap because it runs one test
      # file rather than the whole suite, and it closes the half of the old coverage gap that
      # parameterisation alone only made reachable: reachable is not the same as run.
      - name: Integration tests (engine edges)
        env:
          SCHRODUMP_TEST_INTEGRATION: "1"
          SCHRODUMP_TEST_POSTGRES_IMAGE: postgres:13-alpine
          SCHRODUMP_TEST_MYSQL_IMAGE: mariadb:11
        run: pnpm --filter @schrodump/engines test -- src/probe/probe.integration.test.ts

      - name: Integration tests (postgres 18)
        env:
          SCHRODUMP_TEST_INTEGRATION: "1"
          SCHRODUMP_TEST_POSTGRES_IMAGE: postgres:18-alpine
        run: pnpm --filter @schrodump/engines test -- src/probe/probe.integration.test.ts

  image:
    name: image (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built on every pull request, pushed on none: the Dockerfile is validated by the same event
      # that would break it.
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: schrodump/schrodump:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The architecture in one assertion: dumps run in ephemeral executors, so a database client
      # inside the server image means the boundary was crossed.
      - name: Assert no database client is present
        run: |
          found=$(docker run --rm --entrypoint sh schrodump/schrodump:ci \
            -c 'command -v pg_dump mysqldump mongodump mydumper age psql mysql mongosh 2>/dev/null' || true)
          if [ -n "$found" ]; then
            echo "database client found in the runtime image:"; echo "$found"; exit 1
          fi
          echo "none present"

      - name: Report image size
        run: docker image ls schrodump/schrodump:ci --format '{{.Size}}'

      # Proves the image actually runs: migrations apply, both processes come up and the API
      # answers. The dependency pruning in the Dockerfile is only safe because this step exists.
      - name: Smoke test
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke \
            -e POSTGRES_USER=schrodump -e POSTGRES_PASSWORD=s3cret -e POSTGRES_DB=schrodump \
            postgres:18-alpine
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U schrodump -d schrodump >/dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --name app --network smoke \
            -e DATABASE_URL='postgres://schrodump:s3cret@pg:5432/schrodump' \
            -e SCHRODUMP_KEK="$(openssl rand -base64 32)" \
            -e SCHRODUMP_URL='http://localhost:8080' \
            schrodump/schrodump:ci
          for _ in $(seq 1 40); do
            [ "$(docker inspect app --format '{{.State.Health.Status}}')" = "healthy" ] && break
            sleep 2
          done
          status=$(docker inspect app --format '{{.State.Health.Status}}')
          docker logs app
          [ "$status" = "healthy" ] || { echo "container never became healthy: $status"; exit 1; }
          docker exec app node -e '
            for (const u of ["http://127.0.0.1:8080/login", "http://127.0.0.1:8080/backend/health"]) {
              const r = await fetch(u);
              console.log(u, "->", r.status);
              if (!r.ok) process.exit(1);
            }'

      # Everything above proves the IMAGE runs. This proves the DEPLOYMENT does, which is a
      # different claim and the one that kept being wrong: three defects shipped that no unit or
      # integration test could catch, all of them in the seam between the code and compose.yaml —
      # the socket proxy denying `exec` so verify could never run, scratch on a path only the
      # server's own container could see so every mounted-file operation failed, and nothing
      # pulling executor images so the first backup of every engine failed on a fresh host.
      #
      # Each alone was enough for a new installation to take backups it could never verify or
      # restore. The suite talks to Docker and PostgreSQL directly; the deployment puts a proxy, a
      # volume layout and a network topology in between, and none of it was exercised until now.
      - name: The deployment takes a backup and proves it restores
        run: |
          # compose.yaml pins `schrodump/schrodump:latest`; the build above tagged :ci.
          docker tag schrodump/schrodump:ci schrodump/schrodump:latest
          docker rm -f app pg >/dev/null 2>&1 || true
          scripts/smoke-compose.sh
