# Publishes the image a tag points at, signed and with a bill of materials.
#
# Signing is not ceremony here. An operator pulling schrodump/schrodump is handing the image
# credentials for every database they run; a signature and an SBOM are what let them establish
# that the bytes came from this repository's tag and know what is inside them. Both are keyless
# (OIDC), so there is no signing key to leak — which matters more than usual for a project whose
# threat model is "someone replaces the image".

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  packages: write # push to GHCR
  id-token: write # keyless signing via OIDC

jobs:
  # Nothing published from here was verified before this job existed: release.yml triggers on a tag
  # and had no `needs:`, so `git tag v1.0.0 && git push --tags` on a commit whose CI had failed —
  # or had not finished — produced a signed, attested, SBOM'd image of broken code, carrying
  # provenance that says it is official. The image IS the product here; the two minutes are cheap.
  #
  # This deliberately re-runs rather than querying the tagged commit's check runs. A gate that
  # trusts a green tick from another workflow is a gate that trusts whatever that workflow was when
  # it ran, which is not necessarily what it is now.
  # Fails in seconds instead of a minute deep in buildx. The publishing jobs authenticate to two
  # registries, and a missing Docker Hub secret surfaced as a `docker/login-action` error after QEMU
  # and buildx had already been set up — a confusing place to learn that a repository setting was
  # never made. `secrets` is not available in a job-level `if:`, so this is a step that reads them
  # through env and says which one is absent.
  preflight:
    name: publishing credentials present
    runs-on: ubuntu-latest
    steps:
      - name: Both registries have credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${DOCKERHUB_USERNAME:-}" ] || missing="${missing} DOCKERHUB_USERNAME"
          [ -n "${DOCKERHUB_TOKEN:-}" ] || missing="${missing} DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "missing repository secret(s):${missing}"
            echo
            echo "GHCR authenticates with the built-in GITHUB_TOKEN, but Docker Hub does not."
            echo "Create an access token at https://hub.docker.com/settings/security and add both"
            echo "under Settings -> Secrets and variables -> Actions. See CONTRIBUTING.md."
            echo
            echo "Nothing was published; the tag can be pushed again once they exist."
            exit 1
          fi
          echo "both registries have credentials"

  verify:
    name: verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  image:
    needs: [preflight, verify]
    name: build, sign and publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is built from the commit range since the previous tag.
          fetch-depth: 0

      # A tag like v1.2.3-rc.1 is a release, but it is not the one `latest` should point at.
      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4.2.0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4.5.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ghcr.io/schrodump/schrodump
            schrodump/schrodump
          # latest is never implicit; it is added below only for a stable version.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attached to the image in the registry, so `docker buildx imagetools inspect` answers
          # "what is in this and where did it come from" without trusting a separate file.
          sbom: true
          provenance: mode=max

      # Signed by digest, not by tag: a tag can be moved, a digest cannot.
      # Pinned, because the client version decides the SIGNATURE FORMAT, not just the tool. v3
      # writes an OCI 1.1 bundle; v2 wrote a `<digest>.sig` tag, and a v2 client cannot read a v3
      # signature — it answers "no signatures found", which on a supply-chain check is
      # indistinguishable from an unsigned image. Taking whatever the installer defaults to would
      # let that flip under us between releases, silently changing what an operator has to run.
      # docs/install.md states the requirement; this is the other half of it.
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign the published digests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for image in ghcr.io/schrodump/schrodump schrodump/schrodump; do
            cosign sign --yes "${image}@${DIGEST}"
          done

  # The release notes are the announcement, and they must not appear until everything they
  # announce exists. `image` and `executors` publish in parallel; when the executor build fails,
  # the server image is already pushed, and creating the release there would advertise a version
  # whose STAGED mysql/mariadb path cannot run — the server resolves schrodump/mydumper:1 at backup
  # time and would find nothing. Waiting for both costs nothing: it is the same wall clock.
  release:
    needs: [image, executors]
    name: publish the release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is built from the commit range since the previous tag.
          fetch-depth: 0

      # A newly created GHCR package is PRIVATE until someone makes it public, and this job does
      # not inherit the login from `image`. Without this the SBOM step below fails to pull the very
      # digest we just pushed.
      - uses: docker/login-action@v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A second, downloadable copy of the SBOM. The registry attestation serves tooling; this
      # serves the operator who wants to read it before pulling anything.
      - name: SBOM file
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ghcr.io/schrodump/schrodump@${{ needs.image.outputs.digest }}
          format: spdx-json
          output-file: schrodump-${{ needs.image.outputs.version }}.spdx.json

      # Both the tag and the digest go through env rather than being interpolated straight into
      # the shell: a tag name is attacker-chosen the moment anyone can push one.
      - name: Changelog
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          previous=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## ${TAG}"
            echo
            if [ -n "$previous" ]; then
              echo "Changes since ${previous}:"
              echo
              git log --no-merges --pretty=format:'- %s' "${previous}..${TAG}"
            else
              echo "First tagged release."
              echo
              git log --no-merges --pretty=format:'- %s' "${TAG}"
            fi
            echo
            echo
            echo "Image digest: \`${DIGEST}\`"
            echo
            echo "Verify the signature before running it:"
            echo
            echo '```'
            echo "cosign verify ghcr.io/schrodump/schrodump@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/schrodump/schrodump/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - uses: softprops/action-gh-release@v3.0.2
        with:
          body_path: CHANGELOG_RELEASE.md
          prerelease: ${{ needs.image.outputs.stable == 'false' }}
          files: schrodump-${{ needs.image.outputs.version }}.spdx.json

  executors:
    needs: [preflight, verify]
    name: publish executor images
    runs-on: ubuntu-latest
    # The server resolves this by name at backup time (schrodump/mydumper:1), so a release that ships
    # the server without it ships a product that cannot take a STAGED mysql/mariadb backup. Artifact
    # encryption is in-process (age-encryption), so there is no age executor. The executor moves on its
    # own cadence: the floating :1 tag is what the application code references, and the exact version
    # tag is what an operator pins to.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mydumper
            version: "1.0.3-1"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v4.2.0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4.5.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/executors/${{ matrix.name }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/schrodump/${{ matrix.name }}:${{ matrix.version }}
            ghcr.io/schrodump/${{ matrix.name }}:1
            schrodump/${{ matrix.name }}:${{ matrix.version }}
            schrodump/${{ matrix.name }}:1

      # This image needs the signature MORE than the server image does, not less.
      #
      # An operator types `schrodump/schrodump` once, deliberately, and can check it before pulling.
      # Nobody ever types this one: the server resolves `schrodump/mydumper:1` — a FLOATING tag —
      # by itself at backup time, pulls it, and hands the container the target database's password.
      # Publishing it unsigned meant the image a human chooses was verifiable and the image the
      # product silently fetches on their behalf was not, which is exactly backwards.
      # Pinned, because the client version decides the SIGNATURE FORMAT, not just the tool. v3
      # writes an OCI 1.1 bundle; v2 wrote a `<digest>.sig` tag, and a v2 client cannot read a v3
      # signature — it answers "no signatures found", which on a supply-chain check is
      # indistinguishable from an unsigned image. Taking whatever the installer defaults to would
      # let that flip under us between releases, silently changing what an operator has to run.
      # docs/install.md states the requirement; this is the other half of it.
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign the published digests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          for image in "ghcr.io/schrodump/${NAME}" "schrodump/${NAME}"; do
            cosign sign --yes "${image}@${DIGEST}"
          done
