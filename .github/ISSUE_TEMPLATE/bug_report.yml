name: Bug report
description: Something Schrodump did that it should not have, or did not do that it should have.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        **If this is a security vulnerability, close this form.** Report it privately — see
        [SECURITY.md](https://github.com/schrodump/schrodump/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected instead
      description: >-
        Both halves. "The backup failed" describes a screen; "the job reached FAILED with
        `pg_dump: error: connection to server ... failed` while the same credentials work from
        psql" describes a defect.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        The image tag is a claim; the label is the answer. Read it without starting anything —
        `docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}'
        schrodump/schrodump:<tag>` — or take it from the `server listening` log line. If the
        report is about an artifact, its manifest's `toolVersion` is the one that matters.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      options:
        - postgres
        - mysql
        - mariadb
        - mongodb
        - not engine-specific
    validations:
      required: true

  - type: input
    id: engine-version
    attributes:
      label: Engine version, and topology
      description: >-
        The server version, and whether it is a standalone, a replica set, or a managed service
        (RDS, Atlas, Cloud SQL). Topology changes what can be dumped at all.
      placeholder: "PostgreSQL 16.4 on RDS / MongoDB 7.0 three-member replica set"
    validations:
      required: true

  - type: dropdown
    id: execution-mode
    attributes:
      label: Execution mode
      description: >-
        STREAM pipes the dump straight through; STAGED writes it to a scratch directory first.
        They are different code paths and fail differently.
      options:
        - STREAM
        - STAGED
        - not applicable
    validations:
      required: true

  - type: dropdown
    id: artifact-state
    attributes:
      label: What state did the artifact end in?
      description: >-
        The distinction the whole product turns on. UNOBSERVED means it was written and nobody
        looked; it is not a success. If an artifact was misreported — VERIFIED when it does not
        restore, or FAILED when it does — say so here, because that is the most serious class of
        bug this project can have.
      options:
        - VERIFIED
        - UNOBSERVED
        - FAILED
        - no artifact was produced
        - not about an artifact
    validations:
      required: true

  - type: dropdown
    id: verify-level
    attributes:
      label: Verify level configured on the policy
      options:
        - NONE
        - CHECKSUM
        - FULL_RESTORE
        - not applicable
    validations:
      required: false

  - type: input
    id: destination
    attributes:
      label: Destination
      description: >-
        Which S3-compatible service, since they disagree about multipart uploads, checksums and
        listing semantics. Name the provider, never the bucket, and never a key.
      placeholder: "MinIO RELEASE.2025-09-07 / Cloudflare R2 / AWS S3 eu-west-1 / Backblaze B2"
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: >-
        The smallest sequence that shows it. If it only happens on your data, say what is unusual
        about the data rather than sending it.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        `docker compose logs schrodump` around the failure. **Read them before pasting.** They
        carry connection strings, hostnames and bucket names; redact anything you would not put
        on a billboard. Never paste `SCHRODUMP_KEK` or a private age key.
      render: text
    validations:
      required: false

  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options:
        - the shipped compose.yaml, unmodified
        - the shipped compose.yaml, modified
        - Kubernetes
        - plain docker run
        - other
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: >-
            I checked [the known limitations in
            docs/roadmap.md](https://github.com/schrodump/schrodump/blob/main/docs/roadmap.md)
            and this is not one of them.
          required: true
        - label: >-
            There are no credentials, keys, bucket names or customer data in what I pasted above.
          required: true
