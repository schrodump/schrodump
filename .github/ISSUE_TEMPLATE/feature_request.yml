name: Feature request
description: Something Schrodump should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        A backup tool that does one thing verifiably is worth more than one that does six things
        you have to trust. Several capabilities are outside v1 **on purpose**, each with its
        reason written down in
        [docs/roadmap.md](https://github.com/schrodump/schrodump/blob/main/docs/roadmap.md) —
        physical backups and PITR, the agent, local filesystem destinations, S3 Object Lock.
        Those decisions are open to being re-examined when their reason changes, which is exactly
        what the field below is for.

  - type: textarea
    id: problem
    attributes:
      label: What can you not do today?
      description: >-
        Describe the situation you are in, not the feature you have in mind. The gap is the part
        that cannot be guessed; the solution is usually the part that can.
    validations:
      required: true

  - type: textarea
    id: roadmap
    attributes:
      label: Is this already ruled out in the roadmap? If so, which reason no longer holds?
      description: >-
        If the roadmap does not mention it, say so and skip this. If it does, this is the field
        that matters: name the reason it was excluded and what has changed. "PITR is incompatible
        with being agentless" is a reason, and it stops being decisive only if you are arguing for
        the agent.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What are you doing instead today?
      description: >-
        Including "nothing, we accept the risk". How costly the workaround is says more about
        priority than any severity label.
    validations:
      required: false
